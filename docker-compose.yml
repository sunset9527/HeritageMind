services:
  mysql:
    image: mysql:8.4
    container_name: heritagemind-mysql
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=heritagemind
      - MYSQL_DATABASE=heritagemind
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      target: api
    container_name: heritagemind-api
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - DATABASE_URL=mysql+pymysql://root:heritagemind@mysql:3306/heritagemind
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - craft_data:/app/data
      - sqlite_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # === Streamlit frontend (existing, default) ===
  frontend:
    build:
      context: .
      target: frontend
    container_name: heritagemind-frontend
    restart: "no"
    ports:
      - "8501:8501"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - API_BASE_URL=http://api:8000
      - DATABASE_URL=mysql+pymysql://root:heritagemind@mysql:3306/heritagemind
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - craft_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # === Vue 3 frontend (opt-in via --profile vue) ===
  vue-frontend:
    build:
      context: ./frontend
      target: development
    container_name: heritagemind-vue
    restart: "no"
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    profiles:
      - vue

  # === Nginx production (opt-in via --profile production) ===
  vue-nginx:
    build:
      context: ./frontend
      target: production
    container_name: heritagemind-nginx
    restart: "no"
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    profiles:
      - production

volumes:
  chroma_data:
    driver: local
  craft_data:
    driver: local
  mysql_data:
    driver: local
  sqlite_data:
    driver: local

networks:
  heritagemind-network:
    driver: bridge
