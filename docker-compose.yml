services:
  postgres:
    image: postgres:16-alpine
    container_name: heritagemind-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=heritagemind
      - POSTGRES_PASSWORD=heritagemind
      - POSTGRES_DB=heritagemind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritagemind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      target: api
    container_name: heritagemind-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - DATABASE_URL=postgresql://heritagemind:heritagemind@postgres:5432/heritagemind
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - craft_data:/app/data
      - sqlite_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # === Streamlit frontend (existing, default) ===
  frontend:
    build:
      context: .
      target: frontend
    container_name: heritagemind-frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - API_BASE_URL=http://api:8000
      - DATABASE_URL=postgresql://heritagemind:heritagemind@postgres:5432/heritagemind
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - craft_data:/app/data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # === Vue 3 frontend (opt-in via --profile vue) ===
  vue-frontend:
    build:
      context: ./frontend
      target: development
    container_name: heritagemind-vue
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    profiles:
      - vue

  # === Nginx production (opt-in via --profile production) ===
  vue-nginx:
    build:
      context: ./frontend
      target: production
    container_name: heritagemind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    profiles:
      - production

volumes:
  chroma_data:
    driver: local
  craft_data:
    driver: local
  postgres_data:
    driver: local
  sqlite_data:
    driver: local

networks:
  heritagemind-network:
    driver: bridge
