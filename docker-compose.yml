services:
  mysql:
    image: mysql:8.4
    container_name: heritagemind-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=heritagemind
      - MYSQL_DATABASE=heritagemind
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      target: api
    container_name: heritagemind-api
    restart: unless-stopped
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-your-key-here}
      - DATABASE_URL=mysql+pymysql://root:heritagemind@mysql:3306/heritagemind
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - EMBEDDING_MODE=${EMBEDDING_MODE:-api}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-2}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      - AUDIO_WORKER_ENABLED=${AUDIO_WORKER_ENABLED:-false}
      - LOG_LEVEL=INFO
    volumes:
      - chroma_data:/app/data/chroma_db
      - craft_data:/app/data
      - sqlite_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - heritagemind-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # === Vue 3 development frontend (default) ===
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: heritagemind-vue
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://api:8000
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network

  # === Nginx production (opt-in via --profile production) ===
  vue-nginx:
    build:
      context: ./frontend
      target: production
    container_name: heritagemind-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - heritagemind-network
    profiles:
      - production

volumes:
  chroma_data:
    driver: local
  craft_data:
    driver: local
  mysql_data:
    driver: local
  sqlite_data:
    driver: local

networks:
  heritagemind-network:
    driver: bridge
