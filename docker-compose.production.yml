services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: heritagemind
      MYSQL_USER: heritagemind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: mysql+pymysql://heritagemind:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/heritagemind
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:?RATE_LIMIT_HMAC_KEY must be set}
    depends_on: [mysql, redis]
    volumes:
      - runtime_uploads:/app/data/uploads
      - media_data:/app/data/media
      - index_versions:/app/data/index_versions
      - audio_index:/app/data/audio_chroma
      - chroma_data:/app/data/chroma_db
    networks: [internal]
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: mysql+pymysql://heritagemind:${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}@mysql:3306/heritagemind
      REDIS_URL: redis://redis:6379
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:?RATE_LIMIT_HMAC_KEY must be set}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-api}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      WHISPER_MODEL_DIR: ${WHISPER_MODEL_DIR:-/models/faster-whisper-small}
      AUDIO_WORKER_ENABLED: "true"
    volumes:
      - runtime_uploads:/app/data/uploads
      - media_data:/app/data/media
      - index_versions:/app/data/index_versions
      - audio_index:/app/data/audio_chroma
      - chroma_data:/app/data/chroma_db
      - type: bind
        source: ${WHISPER_MODEL_PATH_HOST:-./models/faster-whisper-small}
        target: /models/faster-whisper-small
        read_only: true
    depends_on: [mysql, redis]
    networks: [internal]
  nginx:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      SSL_CERTIFICATE: ${SSL_CERTIFICATE:-/etc/letsencrypt/fullchain.pem}
      SSL_CERTIFICATE_KEY: ${SSL_CERTIFICATE_KEY:-/etc/letsencrypt/privkey.pem}
    volumes:
      - ${CERT_PATH:-./deploy/certs}:/etc/letsencrypt:ro
      - ./deploy/nginx/heritagemind.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on: [api]
    networks: [internal]
volumes:
  mysql_data:
  runtime_uploads:
  media_data:
  index_versions:
  audio_index:
  chroma_data:
networks:
  internal:
    driver: bridge
