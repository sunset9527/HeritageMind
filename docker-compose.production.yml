services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: heritagemind
      MYSQL_USER: heritagemind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [internal]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://heritagemind:${MYSQL_PASSWORD}@mysql:3306/heritagemind
      REDIS_URL: redis://redis:6379
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    depends_on: [mysql, redis]
    networks: [internal]
  nginx:
    build: ./frontend
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ${CERT_PATH}:/etc/letsencrypt:ro
      - ./deploy/nginx/heritagemind.conf.template:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    networks: [internal]
volumes:
  mysql_data:
networks:
  internal:
    driver: bridge
